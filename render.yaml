# Render Blueprint for MediKiosk
# One web service: FastAPI serves the patient/staff API and the built frontend.
#
# If the existing service was NOT created from a blueprint, set these same
# values in the Render dashboard (Settings) instead:
#   Build Command:  pip install -r backend/requirements.txt && npm ci && npm run build
#   Start Command:  uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend

services:
  - type: web
    name: medikiosk
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./medikiosk.db
